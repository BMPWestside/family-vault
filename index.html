<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --glass:rgba(40,52,130,.45);--edge:rgba(160,175,255,.28);--text:#f2f4ff;--muted:#aab2e8;--accent:#8fa0ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(circle at 15% 10%,#3a4bd0 0,transparent 40%),radial-gradient(circle at 85% 45%,#1f7fd6 0,transparent 38%),radial-gradient(circle at 20% 90%,#5a35b8 0,transparent 42%),#070b24;
  background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:26px;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:0 8px 28px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.topwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:16px 0 2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;background:rgba(30,40,110,.7)}
.top .l{font-size:17px;font-weight:600}
.top .r{font-size:24px;font-weight:700}
.tabs{display:flex;padding:5px;gap:5px;border-radius:999px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:15px;padding:11px 0;border-radius:999px;cursor:pointer}
.tab.on{background:rgba(143,160,255,.28);color:#fff;box-shadow:inset 0 0 0 1px var(--edge)}
.panel{display:none;flex-direction:column;gap:14px}
.panel.on{display:flex}
.sec{padding:14px 16px 16px}
.sec h2{margin:0 0 10px;font-size:15px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);padding-bottom:10px;border-bottom:1px solid var(--edge)}
.cols{display:grid;grid-template-columns:repeat(3,1fr)}
.col{padding:6px 10px;text-align:center}
.col+.col{border-left:1px solid var(--edge)}
.col small{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.col b{font-size:18px;font-weight:600}
form{padding:20px;display:flex;flex-direction:column;gap:14px}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input{font:inherit;font-size:16px;color:var(--text);background:rgba(10,15,60,.45);border:1px solid var(--edge);border-radius:14px;padding:13px 14px;width:100%;color-scheme:dark}
button.save{font:inherit;font-weight:700;font-size:16px;color:#fff;background:#4f63e8;border:0;border-radius:14px;padding:14px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cur{position:relative}.cur span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:16px}.cur input{padding-left:44px}
.dg{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:6px}
.hd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:4px}
.dn{font-size:12px;font-weight:600;display:flex;align-items:center}
.cf{font-size:12px;text-align:center;padding:9px 2px;background:rgba(10,15,60,.45);border:1px solid var(--edge);border-radius:10px;white-space:nowrap}
.cf.t{font-weight:700;color:#fff}
.hd.h{font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--accent);padding-bottom:10px;margin-bottom:4px;border-bottom:1px solid var(--edge)}
.hd.l{text-align:left;font-size:15px}
.bd{display:flex;flex-direction:column;gap:6px}
.sc{overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.sc::-webkit-scrollbar{display:none}
.sc>.dg{scroll-snap-align:start}.sc.m{max-height:120px}.sc.y{max-height:36px}
.cf{line-height:16px}
.msg{font-size:13px;color:var(--accent);min-height:16px;text-align:center}

.wrap{gap:8px;padding:0 12px 12px}.panel{gap:8px}
.card{border-radius:20px}
.topwrap{padding:10px 0 0}
.top{padding:12px 18px}.top .l{font-size:15px}.top .r{font-size:20px}
.tabs{padding:3px}.tab{padding:8px 0;font-size:14px}
.sec{padding:8px 12px 10px}
.hd.h{padding-bottom:6px;margin-bottom:2px;font-size:11px}.hd.l{font-size:13px}
.dg{gap:4px}.bd{gap:4px}
.cf{padding:5px 2px;font-size:12px;line-height:16px;border-radius:8px}.dn{font-size:12px}
.sc.m{max-height:92px}.sc.y{max-height:28px}
form{padding:14px;gap:10px}
input{padding:10px 12px;border-radius:12px;min-width:0;max-width:100%;height:42px;-webkit-appearance:none;appearance:none}
.cur input{padding-left:40px}
.row2{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px}
input[type=date]{display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
.msg{min-height:0}
.rng{display:block;font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--muted)}
.save.alt{background:rgba(143,160,255,.2);border:1px solid var(--edge)}
textarea{font:12px monospace;color:var(--text);background:rgba(10,15,60,.45);border:1px solid var(--edge);border-radius:12px;padding:10px;width:100%}
.rng{display:inline;margin-left:4px;font-size:9px;white-space:nowrap}
.dg{grid-template-columns:1.7fr 1fr 1fr 1fr}
.hd.l{white-space:nowrap}
select{font:inherit;font-size:16px;color:var(--text);background:rgba(10,15,60,.45);border:1px solid var(--edge);border-radius:12px;padding:0 12px;width:100%;height:42px;-webkit-appearance:none;appearance:none;color-scheme:dark}

:root{--med:rgba(70,100,235,.5);--light:rgba(130,160,255,.14)}
.top,.tabs{background:var(--med)}
.tab.on{background:rgba(190,205,255,.28)}
.card.sec,form.card{background:var(--light)}
.hd.h{background:var(--med);border:1px solid var(--edge);border-radius:10px;padding:6px 4px;margin-bottom:2px;color:#e8ecff}
.hd.l{padding-left:10px}
.cf,input,select,textarea{background:var(--light)}
:root{--light:rgba(110,200,255,.16)}

/* MAINFREIGHT: red #E4002B, blue #004C95, maize #F5D6A6 */
:root{--med:rgba(228,0,43,.45);--light:rgba(60,130,215,.2);--edge:rgba(245,214,166,.3);--accent:#F5D6A6;--muted:#c9d4ee;--text:#f6f8ff}
body{background:radial-gradient(circle at 15% 10%,rgba(0,76,149,.9) 0,transparent 45%),radial-gradient(circle at 12% 48%,rgba(228,0,43,.4) 0,transparent 38%),radial-gradient(circle at 20% 92%,rgba(0,76,149,.7) 0,transparent 45%),#030d1f;background-attachment:fixed}
.top{background:var(--med)}
.tab.on{background:rgba(245,214,166,.25);color:#fff}
.hd.h{color:#fff}
.top .r,.col b,.cf.t{color:#F5D6A6}
button.save{background:#E4002B;color:#fff}button.save.inc{background:linear-gradient(180deg,#4f9fff,#2467d6);box-shadow:inset 0 0 0 1.5px rgba(245,214,166,.85)}
button.save.alt{background:rgba(60,130,215,.22);color:var(--text)}
.top{border-radius:34px;padding:6px 14px 6px 10px}
.side{display:flex;align-items:center;gap:10px}
.lg{width:40px;height:40px;object-fit:contain;display:block}
.dg{grid-template-columns:minmax(0,1.05fr) repeat(3,minmax(0,1fr))}
.cf{min-width:0;overflow:hidden;padding-left:0;padding-right:0}
.hd.h{font-size:10.5px;letter-spacing:0;padding-left:2px;padding-right:2px;min-width:0}
.hd.l{padding-left:8px;font-size:13px}
.rng{display:block;margin-left:0;font-size:9px;line-height:1.1}
.dn{font-size:12px;min-width:0}
.rng{display:inline;margin-left:4px;font-size:9px}

:root{--tabon:rgba(245,214,166,.28)}
.tab.on{background:var(--tabon)}
.cf.t{background:var(--tabon);color:#fff6e0}
.dg{grid-template-columns:46px 1px minmax(0,1fr) minmax(0,1fr) 1px minmax(0,1.3fr);gap:4px}
.vd{display:block;width:1px;background:rgba(245,214,166,.4);margin:-2px 0;align-self:stretch}
.dn{font-size:11px;white-space:nowrap}
.hd.l{font-size:11px;padding-left:4px;padding-right:0;white-space:nowrap;overflow:hidden}
.rng{display:block;margin-left:0;font-size:8px;line-height:1.1}
.wrap{gap:6px}
.topwrap{padding:8px 0 0}
.top{padding:3px 12px 3px 8px}
.lg{width:32px;height:32px}
.top .l{font-size:14px}.top .r{font-size:19px}
.side{gap:8px}
.tabs{padding:2px}
.tab{padding:6px 0;font-size:13px}

:root{--dv:rgba(245,214,166,.3)}
.dg{grid-template-columns:48px 1px minmax(0,1fr) minmax(0,1fr) 1px minmax(0,1.3fr)}
.sec{padding:8px 8px 8px 6px}
.sec>.dg{padding-bottom:2px;margin-bottom:2px;border-bottom:1px solid var(--dv)}
.bd{gap:0}
.bd>.dg{padding:2px 0;border-bottom:1px solid var(--dv)}
.bd>.dg:last-child{border-bottom:0}
.hd.l{font-size:10px;padding-left:2px;letter-spacing:0}
.dn{padding-left:0}
.sc.m{max-height:99px}.sc.y{max-height:33px}

.bd{gap:4px}
.bd>.dg{padding:0;border-bottom:0}
.sc.m{max-height:92px}.sc.y{max-height:28px}
.top{padding:3px 6px 3px 5px}
.side{gap:4px}
.topwrap{padding-top:26px}
.wrap{padding-bottom:28px}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{min-height:0}
.wrap{height:100%;display:flex;flex-direction:column;gap:6px;padding-bottom:0}
.topwrap{position:static;flex:none;padding:22px 0 0}
.tabs{flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding-bottom:24px;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll>*{flex:none}

.tab{font-size:12.5px}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px}
.seg{font:inherit;font-size:12px;font-weight:600;color:var(--muted);background:var(--light);border:1px solid var(--edge);border-radius:999px;padding:7px 0;cursor:pointer}
.seg.on{background:var(--tabon);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;gap:6px}
.nb{font:inherit;font-size:24px;line-height:1;color:#fff;background:var(--light);border:1px solid var(--edge);border-radius:999px;width:38px;height:34px;cursor:pointer}
.nt{text-align:center;font-weight:600;font-size:14px}.nt .rng{display:block;margin:2px 0 0;font-size:11px}
.ar{display:flex;justify-content:space-between;padding:5px 6px;font-size:13px;border-bottom:1px solid var(--dv)}.ar:last-child{border-bottom:0}.ar b{color:#F5D6A6}
.col b{font-size:14px}
#rep>button.save{margin-bottom:4px}
.bk summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;padding:12px 16px;color:#fff}
.bk summary::-webkit-details-marker{display:none}
.bk summary::after{content:'\25BE';color:#F5D6A6;font-size:16px}
.bk[open] summary::after{content:'\25B4'}
.bk[open] summary{margin-bottom:8px}

/* Mainfreight tab bar + light-red value fields */
:root{--mf-blue:rgba(0,45,105,.62);--mf-red:rgba(255,95,115,.30);--mf-red-t:rgba(255,95,115,.45)}
.card.tabs{background:var(--mf-blue)}
.tab.on{background:rgba(70,130,215,.38)}
.cf{background:var(--mf-red)}
.cf.t{background:var(--mf-red-t);color:#fff}
/* row labels (MON, Week 1, Oct 26, 2026) as light-red see-through fields */
.dg{grid-template-columns:56px 1px minmax(0,1fr) minmax(0,1fr) 1px minmax(0,1.3fr)}
.dn{background:var(--mf-red);border:1px solid var(--edge);border-radius:10px;padding:0 2px;justify-content:center;text-align:center;font-size:11px;white-space:nowrap;overflow:hidden}
/* column headings (Deliveries/Pickups/Total) = dark see-through Mainfreight blue; their fields = light see-through blue */
.hd.h:not(.l){background:rgba(0,45,105,.62);border-color:rgba(120,170,255,.35)}
.cf{background:rgba(70,150,255,.22)}
.cf.t{background:rgba(70,150,255,.36);color:#fff}
/* D (05-09) / W (Oct) inline; Total column in a different blue shade */
.hd.l .rng{display:inline;margin-left:3px;font-size:9px;white-space:nowrap}
.hd.h:not(.l):last-of-type,.dg>.hd.h:last-child{background:rgba(0,105,165,.62);border-color:rgba(110,210,255,.4)}
.cf.t{background:rgba(60,200,255,.30)}
/* Week table: 4 rows visible, 5th scrolls */
.sc.w{max-height:124px}
/* date bar under Total Earnings */
.top.top2{margin-top:6px;background:rgba(0,45,105,.62);display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 20px;height:40px}
.top2 span{font-size:15px;font-weight:600;color:#fff;white-space:nowrap}
/* centred Day/Week/Month/Year headings; date bar: Day left, Week centre, date right */
.hd.l{text-align:center;padding-left:2px;padding-right:2px}
.top.top2{display:grid;grid-template-columns:1fr auto 1fr}
.top2 span:first-child{justify-self:start}.top2 span:nth-child(2){justify-self:center}.top2 span:last-child{justify-self:end}
.scroll.nofit{overflow-y:hidden;padding-bottom:8px}
.top.top2{display:flex;justify-content:space-between}
.top2 span:first-child,.top2 span:last-child{justify-self:auto}
/* targets */
.top.tgc{display:grid;grid-template-columns:1fr 1fr;gap:14px;height:auto;padding:7px 14px;background:rgba(0,45,105,.62);border-radius:20px}
.tg{min-width:0}.tgt{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.tgt span:first-child{color:#fff;font-weight:600}.tgt b{color:#F5D6A6}
.tgb{height:7px;border-radius:99px;background:rgba(255,255,255,.14);margin-top:5px;overflow:hidden}
.tgb i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2f7fe0,#5cc8ff)}
.tg.hit .tgb i{background:linear-gradient(90deg,#F5D6A6,#ffe9bf)}
/* entry form extras */
.bdg{display:inline-block;min-width:16px;height:16px;line-height:16px;padding:0 4px;margin-left:6px;border-radius:999px;background:#E4002B;color:#fff;font-size:10px;font-weight:700;vertical-align:middle}
button.save.del{background:rgba(228,0,43,.25);border:1px solid rgba(255,120,135,.6);color:#ffd5db}
#rl h2 small{font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:11px;margin-left:6px}
.er{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;font:inherit;font-size:13px;color:var(--text);background:rgba(70,150,255,.18);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;margin-top:6px;cursor:pointer;position:relative}
.er.ex{background:var(--mf-red)}
.er .ed{font-weight:600}.er .em{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.er b{color:#F5D6A6}
.er .ps{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#ffb020}
.rn{color:var(--muted);font-size:13px;padding:6px 2px}
/* entry form sub-tabs, day popup, bright-gold target */
.segs.two{grid-template-columns:1fr 1fr;margin-bottom:0}
#ftabs.lock{pointer-events:none;opacity:.6}
.fg{display:flex;flex-direction:column;gap:10px}

.pi{display:flex;justify-content:space-between;gap:8px;font-size:14px}.pi b{color:#F5D6A6;white-space:nowrap}.pi b.neg{color:#ff9aa8}
.pb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.popc .save{padding:10px;font-size:14px;width:100%}
.tg.hit .tgb i{background:linear-gradient(90deg,#FFB300,#FFE14D);box-shadow:0 0 8px 1px rgba(255,200,0,.85)}

<script>
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?'-':'')+'A$'+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
let entries=[];
try{if(localStorage.getItem('v')!=='2'){localStorage.removeItem('entries');localStorage.setItem('v','2')}entries=JSON.parse(localStorage.getItem('entries')||'[]')}catch(e){}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const setDay=()=>{const v=$('date').value;$('day').value=v?new Date(v+'T00:00').toLocaleDateString('en-AU',{weekday:'long'}):''};
$('date').value=iso(new Date());setDay();$('date').oninput=setDay;

function repBuild(){
  const E=entries.map(e=>Object.assign({e},info(e.d,e.nm)));
  const y=rc.getFullYear(),m=rc.getMonth();
  let t,sub='',list,rows,A=[];
  if(rt==='day'){
    const k=iso(rc),c=info(k);list=entries.filter(e=>e.d===k);
    t=rc.toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short',year:'numeric'});
    const ws=new Date(rc);ws.setDate(rc.getDate()-((rc.getDay()+6)%7));
    rows=[];
    const ml=E.filter(x=>x.ym===c.ym).map(x=>x.e);
    A=[['Month avg per day worked',av(ml,dw(ml))]];
  }else if(rt==='week'){
    const mo=new Date(rc);mo.setDate(rc.getDate()-((rc.getDay()+6)%7));
    const th=new Date(mo);th.setDate(mo.getDate()+3);const su=new Date(mo);su.setDate(mo.getDate()+6);
    const c=info(iso(th));list=E.filter(x=>x.ym===c.ym&&x.w===c.w).map(x=>x.e);
    t='Week '+c.w+', '+MN[th.getMonth()]+' '+th.getFullYear();
    sub=fd(mo)+' - '+fd(su);
    const ks=[];rows=[0,1,2,3,4].map(i=>{const d=new Date(mo);d.setDate(mo.getDate()+i);const k=iso(d);ks.push(k);return[d.toLocaleDateString('en-AU',{weekday:'short'}).toUpperCase()+' '+dm(d),list.filter(e=>e.d===k)]});
    const rest=list.filter(e=>!ks.includes(e.d));if(rest.length)rows.push(['Other days',rest]);
    A=[['Days worked',String(dw(list))],['Avg per day worked',av(list,dw(list))],['Avg per hour (10 hrs/day)',hr(list)]];
  }else if(rt==='month'){
    const k=iso(new Date(y,m,1)).slice(0,7);list=E.filter(x=>x.ym===k).map(x=>x.e);
    t=FM[m]+' '+y;
    rows=[1,2,3,4,5].map(n=>['Week '+n,E.filter(x=>x.ym===k&&x.w===n).map(x=>x.e)]);
    const wn=new Set(E.filter(x=>x.ym===k).map(x=>x.w)).size;
    A=[['Days worked',String(dw(list))],['Avg per day worked',av(list,dw(list))],['Avg per hour (10 hrs/day)',hr(list)],['Avg per week',av(list,wn)]];
  }else if(rt==='quarter'){
    const s=m>=9?9:m>=6?6:m>=3?3:0,q={6:1,9:2,0:3,3:4}[s],fy=s>=6?y+1:y;
    t='Q'+q+' FY'+String(fy).slice(2);sub=MN[s]+' - '+MN[s+2]+' '+y;
    const ks=[0,1,2].map(i=>iso(new Date(y,s+i,1)).slice(0,7));
    const Q=E.filter(x=>ks.includes(x.ym));list=Q.map(x=>x.e);
    rows=ks.map((k,i)=>[MN[s+i]+' '+String(y).slice(2),E.filter(x=>x.ym===k).map(x=>x.e)]);
    const mn=new Set(Q.map(x=>x.ym)).size,wn=new Set(Q.map(x=>x.ym+x.w)).size;
    A=[['Days worked',String(dw(list))],['Avg per day worked',av(list,dw(list))],['Avg per hour (10 hrs/day)',hr(list)],['Avg per week',av(list,wn)],['Avg per month',av(list,mn)]];
  }else{
    const fy=m>=6?y+1:y;t='FY'+String(fy).slice(2);sub='Jul '+(fy-1)+' - Jun '+fy;
    const ks=[];for(let i=0;i<12;i++){const mm=(6+i)%12,yy=i<6?fy-1:fy,k=yy+'-'+String(mm+1).padStart(2,'0');if(k>=BIZ_YM)ks.push([k,MN[mm]+' '+String(yy).slice(2)])}
    const Y=E.filter(x=>x.y===fy);list=Y.map(x=>x.e);
    rows=ks.map(([k,lb])=>[lb,E.filter(x=>x.ym===k).map(x=>x.e)]);
    const mn=new Set(Y.map(x=>x.ym)).size,wn=new Set(Y.map(x=>x.ym+x.w)).size;
    A=[['Days worked',String(dw(list))],['Avg per day worked',av(list,dw(list))],['Avg per hour (10 hrs/day)',hr(list)],['Avg per week',av(list,wn)],['Avg per month',av(list,mn)]];
  }
  const X=rk==='exp',F=X?sumX:sum;
  if(X){const xs=list.filter(e=>e.x),tot=xs.reduce((a,e)=>a+e.x,0),bc={};
    xs.forEach(e=>{const c=e.cat||'Other';bc[c]=(bc[c]||0)+e.x});
    const cs=Object.entries(bc).sort((a,b)=>b[1]-a[1]),top=cs.slice(0,5),rest=cs.slice(5).reduce((a,c)=>a+c[1],0);
    A=[['Entries',String(xs.length)],['Avg per entry',xs.length?fmt(tot/xs.length):'-']].concat(top.map(c=>[c[0],fmt(c[1])]));
    if(rest)A.push(['Other categories',fmt(rest)])}
  const heads=X?XH:IH,v=F(list),tot=v.reduce((a,b)=>a+b,0);
  RP={t,sub,v,heads,tot,A,X,F,rows:rows.map(r=>[r[0],F(r[1])])};
  RP.ex=list.filter(e=>e.x).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0);
  RP.rl=rows.map(r=>r[1]);RP.hd={day:'Day',week:'Day',month:'Week',quarter:'Month',year:'Month'}[rt];
  return RP;
}
function renderRep(){
  const R=repBuild(),P=['week','month','quarter','year'],N=['Week','Month','Quarter','Year'];
  const seg=P.map((p,i)=>`<button type="button" class="seg${p===rt?' on':''}" data-r="${p}">${N[i]}</button>`).join('');
  const av2=R.A.map(a=>`<div class="ar"><span>${a[0]}</span><b>${a[1]}</b></div>`).join('');
  const rkt=`<div class="segs four" id="rkt"><button type="button" class="seg${R.X?'':' on'}" data-k="inc">Income</button><button type="button" class="seg${R.X?' on':''}" data-k="exp">Expenses</button><button type="button" class="seg" data-k="trend">Trend</button><button type="button" class="seg" data-k="find">Find</button></div>`;
  $('rep').innerHTML=rkt+`<div class="card sec"><div class="segs">${seg}</div>
  <div class="nav"><button type="button" class="nb" data-n="-1">&#8249;</button><div class="nt">${R.t}${R.sub?`<span class="rng">${R.sub}</span>`:''}</div><button type="button" class="nb" data-n="1">&#8250;</button></div></div>
  <div class="card sec"><div class="cols" style="grid-template-columns:repeat(${R.heads.length+1},1fr)">${R.heads.map((h,i)=>`<div class="col"><small>${h}</small><b>${fmt(R.v[i])}</b></div>`).join('')}<div class="col"><small>Total</small><b>${fmt(R.tot)}</b></div></div></div>
  <div class="card sec"><div class="arl${R.X?' sx':''}">${av2}</div></div>
  ${R.rows.length?`<details class="bk"><summary class="card sec">Breakdown</summary>${table(R.hd,R.rows.map((r,i)=>row(r[0],R.rl[i],null,R.F)).join(''),rt==='month'?'sc w':rt==='year'?'sc m':'',R.heads)}</details>`:''}
  <div class="dl2"><button class="save" type="button" id="pdfb">Download PDF</button><button class="save alt" type="button" id="csvb">Download CSV</button></div>`;
  fit();
}

$('rep').onclick=ev=>{
  const kb=ev.target.closest('[data-k]');if(kb){rk=kb.dataset.k;renderRep();return}
  const r=ev.target.closest('[data-r]'),n=ev.target.closest('[data-n]');
  if(r){rt=r.dataset.r;renderRep();return}
  
  if(n){const s=+n.dataset.n,y=rc.getFullYear(),m=rc.getMonth();
    rc=rt==='day'?new Date(y,m,rc.getDate()+s):rt==='week'?new Date(y,m,rc.getDate()+7*s):rt==='month'?new Date(y,m+s,1):rt==='quarter'?new Date(y,m+3*s,1):new Date(y+s,m,1);
    renderRep();return}
  if(ev.target.id==='pdfb')mkPdf();
  if(ev.target.id==='csvb')mkCsv();
};
async function shareFile(f,nm){
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nm});return}}catch(e){if(e&&e.name==='AbortError')return}
  const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=nm;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
}
function mkCsv(){
  const q=v=>{v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const H=['Date','Day','Type','Category','Note','Deliveries','Pickups','Income total','Expense','Director loan (+in / -out)','Mainfreight month','Week of month','Financial year','Synced to Google Sheets'];
  const L=entries.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).map(e=>{const i=info(e.d,e.nm),de=e.a!==undefined?e.a:(e.del||0),pu=e.pu||0;
    const ld=!!e.ln;return [e.d,dayName(e.d),ld?'Director loan':e.x?'Expense':'Income',e.x?(e.cat||''):'',(e.x||ld)?(e.note||''):'',(e.x||ld)?'':de.toFixed(2),(e.x||ld)?'':pu.toFixed(2),(e.x||ld)?'':(de+pu).toFixed(2),e.x?e.x.toFixed(2):'',ld?e.ln.toFixed(2):'',i.ym,i.w,'FY'+String(i.y).slice(2),e.s?'Yes':'No']});
  const csv='\ufeff'+[H].concat(L).map(r=>r.map(q).join(',')).join('\r\n');
  const nm='BMP-Cashflow-'+iso(new Date())+'.csv';
  shareFile(new File([csv],nm,{type:'text/csv'}),nm);
}

  const have=new Set(entries.map(sig)),add=j.entries.filter(e=>e&&/^\d{4}-\d\d-\d\d$/.test(e.d)&&!have.has(sig(e)));
  if(!confirm('Import '+add.length+' new entr'+(add.length===1?'y':'ies')+' and restore settings?'))return;
  add.forEach(e=>{e.s=false;entries.push(e)});if(j.cfg)CFG=Object.assign(CFG,j.cfg);if(Array.isArray(j.rem))REM=j.rem;if(j.odo!=null)ODO=j.odo;if(j.mf)MF=Object.assign({},j.mf,MF);if(Array.isArray(j.rc)&&j.rc.length)RC=j.rc;if(j.bk)BK=Object.assign(BK,j.bk);if(Array.isArray(j.db)&&j.db.length){DB=j.db;dbSave()}saveX();
  saveCfg();persist();render();toolsView();autoSync();alert('Backup imported.')}
/* ===== financial year pack ===== */
function fyData(fy){const L=entries.filter(e=>info(e.d,e.nm).y===fy);
  const months=[];for(let i=0;i<12;i++){const mm=(6+i)%12,yy=i<6?fy-1:fy,k=yy+'-'+String(mm+1).padStart(2,'0');if(k<BIZ_YM)continue;months.push([MN[mm]+' '+yy,agg(e=>info(e.d,e.nm).ym===k)])}
  const T=agg(e=>info(e.d,e.nm).y===fy),cats={},reps={};let sal=0,sup=0,truck=0;
  L.forEach(e=>{if(!e.x)return;const c=e.cat||'Other',g=gExp(e),o=g.rep?reps:cats;(o[c]=o[c]||{t:0,g:0,n:0});o[c].t+=e.x;o[c].g+=g.g;o[c].n+=g.n;if(/^salary/i.test(c))sal+=e.x;if(/^superannuation/i.test(c))sup+=e.x;if(/^truck repayment/i.test(c))truck+=e.x});
  const dl=entries.reduce((a,e)=>a+(e.ln||0),0),tp=entries.filter(e=>e.x&&/^truck repayment/i.test(e.cat||'')).reduce((a,e)=>a+e.x,0);
  return{fy,months,T,cats:Object.entries(cats).sort((a,b)=>b[1].t-a[1].t),reps:Object.entries(reps),sal,sup,truck,dl,left:Math.max(0,TRUCK.price-TRUCK.deposit-tp),tax:Math.max(0,T.P)*CFG.tax/100}}
function fyCsv(fy){const D=fyData(fy),q=v=>{v=String(v==null?'':v);return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v},f2=n=>(+n).toFixed(2),R=[];
  R.push(['BMP Westside - Financial year FY'+String(fy).slice(2)+' (1 Jul '+(fy-1)+' - 30 Jun '+fy+')']);R.push(['GST registered',CFG.gst?'Yes':'No']);R.push([]);
  R.push(['Month','Income (ex GST)','GST collected','Expenses (ex GST)','GST credits','Profit before depreciation']);
  D.months.forEach(m=>R.push([m[0],f2(m[1].I),f2(m[1].Ig),f2(m[1].X),f2(m[1].Xg),f2(m[1].P)]));
  R.push(['Total',f2(D.T.I),f2(D.T.Ig),f2(D.T.X),f2(D.T.Xg),f2(D.T.P)]);R.push([]);
  R.push(['Expense category','Total paid','GST included','Ex GST']);D.cats.forEach(c=>R.push([c[0],f2(c[1].t),f2(c[1].g),f2(c[1].n)]));R.push([]);
  R.push(['Loan repayments (not expenses)','Paid']);D.reps.forEach(c=>R.push([c[0],f2(c[1].t)]));R.push([]);
  R.push(['Salary paid',f2(D.sal)]);R.push(['Superannuation paid',f2(D.sup)]);R.push(['Net GST for the year (collected - credits)',f2(D.T.Ig-D.T.Xg)]);
  R.push(['Profit before depreciation',f2(D.T.P)]);R.push(['Depreciation (accountant to enter)','']);R.push(['Company tax set-aside at '+CFG.tax+'%',f2(D.tax)]);
  R.push(['Truck loan paid this year',f2(D.truck)]);R.push(['Truck loan remaining (today)',f2(D.left)]);R.push(['Director loan balance today (+ company owes you)',f2(D.dl)]);
  const nm='BMP-FY'+String(fy).slice(2)+'-accountant-pack.csv';shareFile(new File(['﻿'+R.map(r=>r.map(q).join(',')).join('\r\n')],nm,{type:'text/csv'}),nm)}
async function fyPdf(fy){const J=window.jspdf;if(!J){alert('PDF tool is still loading. Check your internet and try again.');return}

async function hashPin(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bmp:'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of 'bmp:'+p)h=((h<<5)+h+c.charCodeAt(0))|0;return'x'+h}}
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

  if(lkMode==='new'){lkTmp=pin;lkMode='new2';$('lkt').textContent='Confirm PIN';lkDraw();return}
  if(lkMode==='new2'){if(pin!==lkTmp){lkMode='new';$('lkt').textContent='Choose a 4-digit PIN (backup)';$('lkm').textContent='PINs did not match. Try again.';lkDraw();return}

function trendHtml(){const cur=info(todayK()).ym,ms=[];for(let y=cur;y>=BIZ_YM&&ms.length<12;y=prevYm(y))ms.unshift(y);
  if(!tm)tm=ms.length<3?'w':'m';let P=[];
  if(tm==='m')P=ms.map(ym=>{const a=agg(e=>info(e.d,e.nm).ym===ym);return{l:MN[+ym.slice(5)-1],I:a.I,X:a.X}});
  else{const t=new Date();t.setDate(t.getDate()-((t.getDay()+6)%7));for(let i=11;i>=0;i--){const s=new Date(t);s.setDate(t.getDate()-7*i);const en=new Date(s);en.setDate(s.getDate()+6);if(iso(en)<BIZ_START)continue;const a=agg(e=>e.d>=iso(s)&&e.d<=iso(en));P.push({l:s.getDate()+'/'+(s.getMonth()+1),I:a.I,X:a.X})}}
  P.forEach(p=>p.P=p.I-p.X);
  const W=340,H=150,L=8,T=14,B=18,top=Math.max(1,...P.map(p=>Math.max(p.I,p.X,p.P))),bot=Math.min(0,...P.map(p=>p.P)),y=v=>T+(H-T-B)*(top-v)/(top-bot),n=Math.max(1,P.length),sw=(W-2*L)/n,bw=Math.min(20,sw*.34);
  let g=`<line x1="${L}" x2="${W-L}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(160,175,255,.4)"/><text x="${L}" y="9" fill="#c9d4ee" font-size="9">${kc(top)}</text>`;
  P.forEach((p,i)=>{const cx=L+sw*(i+.5);g+=`<rect x="${cx-bw-1}" y="${Math.min(y(p.I),y(0))}" width="${bw}" height="${Math.abs(y(0)-y(p.I))}" rx="2" fill="#4dff9a"/><rect x="${cx+1}" y="${Math.min(y(p.X),y(0))}" width="${bw}" height="${Math.abs(y(0)-y(p.X))}" rx="2" fill="#ff7a8a"/><text x="${cx}" y="${H-5}" fill="#c9d4ee" font-size="9" text-anchor="middle">${p.l}</text>`});
  if(P.length>1)g+=`<polyline fill="none" stroke="#ffd76a" stroke-width="2" points="${P.map((p,i)=>(L+sw*(i+.5))+','+y(p.P)).join(' ')}"/>`;
  P.forEach((p,i)=>g+=`<circle cx="${L+sw*(i+.5)}" cy="${y(p.P)}" r="3.2" fill="#ffd76a"/>`);
  const tI=P.reduce((a,p)=>a+p.I,0),tX=P.reduce((a,p)=>a+p.X,0),best=P.reduce((a,p)=>!a||p.P>a.P?p:a,null),u=tm==='m'?'month':'week';
  const none=!P.length||(!tI&&!tX);
  return `<div class="card sec tv"><div class="tc"><div class="segs two tms"><button type="button" class="seg${tm==='w'?' on':''}" data-tm="w">Weekly</button><button type="button" class="seg${tm==='m'?' on':''}" data-tm="m">Monthly</button></div>
${none?'<div class="rn">No data yet</div>':`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg><div class="lgd"><i style="background:#4dff9a"></i>Income<i style="background:#ff7a8a"></i>Expenses<i style="background:#ffd76a"></i>Profit · excl GST</div>`}</div>
<div class="ts"><div class="pft"><span>Average income per ${u}</span><b>${kN(tI/n)}</b></div><div class="pft"><span>Average expenses per ${u}</span><b>${kN(tX/n)}</b></div><div class="pft"><span>Profit margin</span><b>${tI>0?Math.round((tI-tX)/tI*100)+'%':'-'}</b></div><div class="pft big"><span>Best ${u}${best?' ('+best.l+')':''}</span><b>${best?kN(best.P):'-'}</b></div></div></div>`}
function findHtml(){const cur=info(todayK()).ym;let last=cur;entries.forEach(e=>{const m=info(e.d,e.nm).ym;if(m>last)last=m});const ms=[];for(let y=last;y>=BIZ_YM;y=prevYm(y))ms.push(y);
  return `<div class="card sec fnd"><div class="fctl"><input id="fq" type="search" placeholder="Search note, category, amount, date" value="${esc(fq)}" autocomplete="off"><select id="ft">${[['all','All types'],['inc','Income'],['exp','Expenses'],['loan','Director loan']].map(([k,n])=>`<option value="${k}"${ft===k?' selected':''}>${n}</option>`).join('')}</select><select id="fmn"><option value="all">All months</option>${ms.map(m=>`<option value="${m}"${fmn===m?' selected':''}>${ymName(m)}</option>`).join('')}</select></div><div class="fsum" id="fs"></div><div class="fres" id="fr"></div></div>`}
const incAmt=e=>(e.a!==undefined?e.a:(e.del||0))+(e.pu||0);
function findList(){const q=fq.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return entries.filter(e=>{const ty=e.ln?'loan':e.x?'exp':'inc';if(ft!=='all'&&ft!==ty)return false;if(fmn!=='all'&&info(e.d,e.nm).ym!==fmn)return false;if(!q.length)return true;
    const a=ty==='inc'?incAmt(e):ty==='exp'?e.x:Math.abs(e.ln),hay=[e.cat,e.note,ty==='inc'?'income delivery pickup':ty==='loan'?'director loan':'expense',a.toFixed(2),String(a),e.d,dAU(e.d)].join(' ').toLowerCase();
    return q.every(w=>hay.includes(w))}).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0)}
